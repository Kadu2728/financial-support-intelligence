[project]
name = "financial-support-intelligence"
version = "0.1.0"
description = "Plataforma de inteligencia operacional para equipes de suporte financeiro"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # Upload multipart dos documentos.
    "python-multipart>=0.0.20",
    # Extracao de texto. Sao dependencias de RUNTIME: o worker de ingestao nao
    # funciona sem elas, entao nao podem ficar em extra opcional.
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# Producao com Cloudflare R2. Em dev o storage e local e boto3 nao e necessario.
s3 = ["boto3>=1.35"]

# Geracao do acervo sintetico de demonstracao (scripts/gerar_acervo.py). Nao e
# necessario para rodar a aplicacao: os arquivos gerados ficam versionados.
demo = ["reportlab>=4.2"]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ----------------------------------------------------------------------------
# Ruff — lint + format. Substitui flake8, isort, black e pyupgrade.
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "TID",      # tidy-imports
    "RUF",      # ruff-specific
    "ASYNC",    # async antipatterns
    "S",        # bandit — regras de seguranca
]
ignore = [
    "S101",  # assert: legitimo em testes
    "B008",  # chamada em default: e o padrao de Depends() do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # credenciais hardcoded sao esperadas em fixtures

[tool.ruff.lint.flake8-tidy-imports]
# Fronteiras entre modulos sao mantidas por convencao e revisao (ver ADR-0001).
ban-relative-imports = "all"

# ----------------------------------------------------------------------------
# Mypy — strict desde o inicio. Afrouxar depois e facil; apertar e refactor.
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# boto3 e opcional (extra `s3`) e nao traz stubs. O acesso ao client ja e tipado
# como Any em app/integrations/storage/s3.py, entao nada de util se perde.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: exige banco de dados real",
]
